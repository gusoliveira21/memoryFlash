name: "Teste de Conexão"

on:
  workflow_dispatch:
  push:
    branches:
      - test-connection

jobs:
  test-connection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.29.2'

      - name: Verificar Flutter
        run: |
          flutter --version
          flutter doctor -v

      - name: Verificar estrutura do projeto
        run: |
          echo "📁 Estrutura do projeto:"
          ls -la
          echo ""
          echo "📱 Android:"
          ls -la android/app/ || echo "Pasta android/app não encontrada"
          echo ""
          echo "🔧 Workflows:"
          ls -la .github/workflows/ || echo "Pasta workflows não encontrada"

      - name: Verificar secrets (sem expor valores)
        run: |
          echo "🔐 Verificando secrets..."
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "⚠️  KEYSTORE_BASE64: não configurado"
          else
            echo "✅ KEYSTORE_BASE64: configurado"
          fi
          
          if [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
            echo "⚠️  KEYSTORE_PASSWORD: não configurado"
          else
            echo "✅ KEYSTORE_PASSWORD: configurado"
          fi
          
          if [ -z "${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}" ]; then
            echo "⚠️  GCP_SERVICE_ACCOUNT_KEY: não configurado"
          else
            echo "✅ GCP_SERVICE_ACCOUNT_KEY: configurado"
          fi

      - name: Teste de build básico (sem assinatura)
        run: |
          flutter clean
          flutter pub get
          echo "✅ Dependências instaladas"
          
          # Tenta fazer um build de debug (não precisa de assinatura)
          flutter build apk --debug || echo "⚠️  Build falhou (pode ser normal se faltar configurações)"

      - name: Resultado
        run: |
          echo "✅ Teste de conexão concluído!"
          echo "📊 Status: GitHub Actions está funcionando"

