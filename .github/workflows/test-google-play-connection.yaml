name: "Teste Conexão Google Play Console"

on:
  workflow_dispatch:
  push:
    branches:
      - test-google-play

jobs:
  test-google-play-connection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.29.2'

      - name: Verificar secrets obrigatórios
        run: |
          echo "🔐 Verificando configuração dos secrets..."
          MISSING_SECRETS=0
          
          if [ -z "${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}" ]; then
            echo "❌ GCP_SERVICE_ACCOUNT_KEY: NÃO configurado"
            MISSING_SECRETS=$((MISSING_SECRETS + 1))
          else
            echo "✅ GCP_SERVICE_ACCOUNT_KEY: configurado"
          fi
          
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "❌ KEYSTORE_BASE64: NÃO configurado"
            MISSING_SECRETS=$((MISSING_SECRETS + 1))
          else
            echo "✅ KEYSTORE_BASE64: configurado"
          fi
          
          if [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
            echo "❌ KEYSTORE_PASSWORD: NÃO configurado"
            MISSING_SECRETS=$((MISSING_SECRETS + 1))
          else
            echo "✅ KEYSTORE_PASSWORD: configurado"
          fi
          
          if [ -z "${{ secrets.KEY_ALIAS }}" ]; then
            echo "❌ KEY_ALIAS: NÃO configurado"
            MISSING_SECRETS=$((MISSING_SECRETS + 1))
          else
            echo "✅ KEY_ALIAS: configurado"
          fi
          
          if [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "❌ KEY_PASSWORD: NÃO configurado"
            MISSING_SECRETS=$((MISSING_SECRETS + 1))
          else
            echo "✅ KEY_PASSWORD: configurado"
          fi
          
          if [ $MISSING_SECRETS -gt 0 ]; then
            echo ""
            echo "⚠️  Faltam $MISSING_SECRETS secret(s). Configure no GitHub: Settings → Secrets → Actions"
            exit 1
          fi
          
          echo ""
          echo "✅ Todos os secrets estão configurados!"

      - name: Validar JSON do Service Account
        run: |
          echo "🔍 Validando formato do JSON do Service Account..."
          echo "${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}" > /tmp/service_account.json
          
          if python3 -m json.tool /tmp/service_account.json > /dev/null 2>&1; then
            echo "✅ JSON válido"
            # Extrai informações básicas (sem expor dados sensíveis)
            python3 << 'EOF'
import json
with open('/tmp/service_account.json') as f:
    data = json.load(f)
    print(f"✅ Project ID: {data.get('project_id', 'N/A')}")
    print(f"✅ Client Email: {data.get('client_email', 'N/A')[:20]}...")
            EOF
          else
            echo "❌ JSON inválido ou malformado"
            exit 1
          fi
          rm /tmp/service_account.json

      - name: Clean e Install dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Setup Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks
          echo "✅ Keystore criado"

      - name: Configure signing
        run: |
          echo "storeFile=app/keystore.jks" >> android/key.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "✅ Assinatura configurada"

      - name: Build App Bundle
        run: |
          echo "🔨 Construindo App Bundle..."
          flutter build appbundle --release
          
          if [ -f "build/app/outputs/bundle/release/app-release.aab" ]; then
            echo "✅ App Bundle criado com sucesso!"
            ls -lh build/app/outputs/bundle/release/app-release.aab
          else
            echo "❌ Erro: App Bundle não foi criado"
            exit 1
          fi

      - name: Testar Conexão com Google Play Console
        id: test_connection
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonRaw: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          packageName: com.example.memoryflash
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - name: Resultado do Teste
        run: |
          if [ "${{ steps.test_connection.outcome }}" == "success" ]; then
            echo "🎉 ✅ CONEXÃO COM GOOGLE PLAY CONSOLE ESTABELECIDA COM SUCESSO!"
            echo "✅ Autenticação funcionando"
            echo "✅ Upload realizado com sucesso (track: internal)"
            echo ""
            echo "📱 O app foi publicado na track 'internal' do Google Play Console"
          else
            echo "❌ Falha na conexão ou upload"
            echo ""
            echo "Possíveis causas:"
            echo "1. Service Account sem permissões no Google Play Console"
            echo "2. Package name incorreto (com.example.memoryflash)"
            echo "3. App não criado no Google Play Console"
            echo "4. JSON do Service Account inválido"
            echo ""
            echo "Verifique os logs acima para mais detalhes"
            exit 1
          fi

