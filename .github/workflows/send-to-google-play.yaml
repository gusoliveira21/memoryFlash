name: Envia versao para Google Play Console

on:
  workflow_dispatch:
  pull_request:
    branches:
      - to_google_play

jobs:
  test-google-play-connection:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.5

      - name: Install dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Setup Keystore
        run: |
          # Mantemos a geração dinâmica do arquivo JKS dentro de android/app
          mkdir -p android/app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks

      - name: Configure signing
        run: |
          # Criamos o key.properties em android/ pois seu build.gradle.kts usa rootProject.file
          # Definimos storeFile apenas como o nome do arquivo, pois ele será buscado dentro de android/app pelo Gradle
          cat > android/key.properties <<EOF
          storeFile=keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build App Bundle
        # Adicionado o build-number para evitar conflitos de versão no console
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - name: Create Service Account JSON
        run: echo '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' > android/service-account.json

      - name: Testar Conexão e Upload
        id: test_connection
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: android/service-account.json
          packageName: com.gusoliveira21.memoryflash
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed # Alterado de draft para completed conforme seu desejo de testar a conexão final

      - name: Resultado do Teste
        if: always()
        run: |
          if [ "${{ steps.test_connection.outcome }}" = "success" ]; then
            echo "🎉 CONEXÃO E UPLOAD REALIZADOS COM SUCESSO!"
          else
            echo "❌ Falha no processo. Verifique os logs acima."
            exit 1
          fi
