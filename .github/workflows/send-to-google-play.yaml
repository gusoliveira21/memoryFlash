name: Envia versao para Google Play Console

on:
  workflow_dispatch:
  pull_request:
    branches:
      - to_google_play

jobs:
  test-google-play-connection:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 📋 Informações da Execução
        run: |
          echo "🌿 Branch atual: ${{ github.ref_name }}"
          PACKAGE_NAME=$(grep '^name:' pubspec.yaml | awk '{print $2}')
          echo "📦 Nome do pacote (pubspec): $PACKAGE_NAME"
          echo "🆔 App ID (Android): com.gusoliveira21.memoryflash"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.5

      - name: Install dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Setup Keystore
        run: |
          # Criamos a keystore diretamente na pasta android/ para alinhar com o jarsigner
          mkdir -p android
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/keystore.jks

      - name: Configure signing
        run: |
          # Criamos o key.properties na raiz da pasta android (rootProject)
          # O storeFile aponta para 'keystore.jks' porque ambos estarão na mesma pasta (android/)
          cat > android/key.properties <<EOF
          storeFile=keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build App Bundle
        run: |
          # O Flutter build aciona o Gradle, que por sua vez lerá o key.properties e a keystore
          flutter build appbundle --release

      - name: Create Service Account JSON
        run: echo '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' > android/service-account.json

      - name: Testar Conexão com Google Play Console
        id: test_connection
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: android/service-account.json
          packageName: com.gusoliveira21.memoryflash
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - name: Resultado do Teste
        if: always()
        run: |
          OUTCOME="${{ steps.test_connection.outcome }}"
          if [ "$OUTCOME" = "success" ]; then
            echo "🎉 CONEXÃO ESTABELECIDA COM SUCESSO!"
          else
            echo "❌ Falha no upload ou conexão. Verifique os logs do build acima."
            exit 1
          fi