name: Teste Conexão Google Play Console

on:
  workflow_dispatch:
  push:
    branches:
      - to-google-play

jobs:
  test-google-play-connection:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- NOVO STEP DE INFORMAÇÕES ---
      - name: 📋 Informações da Execução
        run: |
          echo "🌿 Branch atual: ${{ github.ref_name }}"
          PACKAGE_NAME=$(grep '^name:' pubspec.yaml | awk '{print $2}')
          echo "📦 Nome do pacote (pubspec): $PACKAGE_NAME"
          echo "🆔 App ID (Android): com.????.memoryflash" 
      # --------------------------------

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.5

      - name: Verificar secrets obrigatórios
        env:
          GCP_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          K_ALIAS: ${{ secrets.KEY_ALIAS }}
          K_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "🔐 Verificando configuração dos secrets..."
          MISSING=0

          [ -z "$GCP_KEY" ] && echo "❌ GCP_SERVICE_ACCOUNT_KEY: Faltando" && MISSING=$((MISSING+1))
          [ -z "$KS_B64" ] && echo "❌ KEYSTORE_BASE64: Faltando" && MISSING=$((MISSING+1))
          [ -z "$KS_PASS" ] && echo "❌ KEYSTORE_PASSWORD: Faltando" && MISSING=$((MISSING+1))
          [ -z "$K_ALIAS" ] && echo "❌ KEY_ALIAS: Faltando" && MISSING=$((MISSING+1))
          [ -z "$K_PASS" ] && echo "❌ KEY_PASSWORD: Faltando" && MISSING=$((MISSING+1))

          if [ "$MISSING" -gt 0 ]; then
            exit 1
          fi

          echo "✅ Todos os secrets estão presentes."

      - name: Validar JSON
        env:
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: |
          python3 - <<'PY'
          import json, os
          raw = os.environ["GCP_SERVICE_ACCOUNT_KEY"]
          json.loads(raw)
          print("✅ JSON válido")
          PY

      - name: Install dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Setup Keystore
        run: |
          mkdir -p android/app
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks

      - name: Configure signing
        run: |
          mkdir -p android
          cat > android/key.properties <<EOF
          storeFile=app/keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build App Bundle
        run: |
          flutter build appbundle --release

      - name: Create Service Account JSON
        run: echo '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' > android/service-account.json

      - name: Testar Conexão com Google Play Console
        id: test_connection
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: android/service-account.json
          packageName: com.example.memoryflash
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - name: Resultado do Teste
        if: always()
        run: |
          echo "🌿 Branch executada: ${{ github.ref_name }}"
          OUTCOME="${{ steps.test_connection.outcome }}"
          echo "Outcome do step test_connection: $OUTCOME"

          if [ "$OUTCOME" = "success" ]; then
            echo "🎉 CONEXÃO ESTABELECIDA COM SUCESSO PARA com.example.memoryflash!"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "❌ Falha no upload. Verifique permissões no Google Play Console."
            exit 1
          else
            echo "⚠️ Step de upload não foi executado (estado: $OUTCOME). Verifique os steps anteriores."
            exit 1
          fi
